<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BrownDogGames — Advertisement</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Segoe UI,sans-serif}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101010;color:#eee}
main{max-width:480px;padding:28px;text-align:center}
p{line-height:1.6;color:#bbb}
button{padding:12px 20px;border:1px solid #888;border-radius:8px;background:#242424;color:white;font:600 16px system-ui;cursor:pointer}
button:focus-visible{outline:3px solid #ffc453;outline-offset:4px}
</style>
</head>
<body>
<main>
<h1>Advertisement</h1>
<p>Sponsored content may open in a separate tab. You can return to your game at any time.</p>
<button id="return-to-game" type="button">Return to game</button>
<p id="status" role="status"></p>
</main>
<script>
(function () {
  var button = document.getElementById('return-to-game');
  // Register before the provider so returning to the game is not an ad click.
  window.addEventListener('click', function (event) {
    if (!button.contains(event.target)) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    if (window.parent !== window) {
      // Compatibility message used by the existing exported browser games.
      // It contains no personal data; games can be hosted on different origins.
      window.parent.postMessage({type:'popunder_clicked'}, '*');
    } else {
      document.getElementById('status').textContent = 'You can close this tab and return to your game.';
    }
  }, true);
})();
</script>
<script>(function(s){s.dataset.zone='11309066',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
</body>
</html>
